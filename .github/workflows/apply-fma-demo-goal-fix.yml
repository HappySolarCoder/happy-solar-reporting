name: Apply FMA demo goal fix

on:
  push:
    branches:
      - cursor/fma-demo-goal-stephen-4259
    paths:
      - scripts/apply_fma_demo_goal_fix.py

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fma-demo-goal-stephen-4259
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prefer the production goal
        run: python3 scripts/apply_fma_demo_goal_fix.py
      - name: Commit the dashboard change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/fma_dashboard.py
          if git diff --cached --quiet; then
            echo "dashboard already updated"
            exit 0
          fi
          git commit -m "Use the production FMA demo goal when a demo login shares the name."
          git push origin HEAD:cursor/fma-demo-goal-stephen-4259
