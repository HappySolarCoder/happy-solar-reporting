name: Apply Lead Gen Inbound/3PL split
on:
  workflow_dispatch:
  push:
    branches: [charles/split-inbound-3pl-leadgen]
    paths:
      - patches/leadgen-inbound-3pl.split.patch.d/**
      - .github/workflows/apply-leadgen-split.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: charles/split-inbound-3pl-leadgen
          fetch-depth: 0

      - name: Restore company_overview from master and apply patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git show origin/master:api/company_overview.py > api/company_overview.py
          rm -rf api/_co_z64
          python3 -c 'import pathlib; parts=sorted(pathlib.Path("patches/leadgen-inbound-3pl.split.patch.d").glob("p*.hex")); raw=b"".join(bytes.fromhex(p.read_text().strip()) for p in parts); pathlib.Path("/tmp/leadgen.split.patch").write_bytes(raw)'
          patch -p1 < /tmp/leadgen.split.patch
          grep -q "Inbound Funnel" api/company_overview.py
          grep -q "3PL Funnel" api/company_overview.py
          ! grep -q "THREE_PL_INBOUND_KEYS" api/company_overview.py
          ! grep -q "3PL/Inbound Funnel" api/company_overview.py
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Apply Lead Gen Inbound/3PL funnel split to company_overview"
          git push origin HEAD:charles/split-inbound-3pl-leadgen
