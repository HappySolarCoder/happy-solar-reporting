name: Apply Lead Gen Inbound/3PL split

on:
  push:
    branches: [charles/split-inbound-3pl-leadgen]
    paths:
      - patches/leadgen-inbound-3pl.patch
      - .github/workflows/apply-leadgen-inbound-3pl-split.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charles/split-inbound-3pl-leadgen
          fetch-depth: 0
      - name: Restore company_overview from master and apply patch
        run: |
          set -euo pipefail
          git checkout origin/master -- api/company_overview.py
          git apply --whitespace=nowarn patches/leadgen-inbound-3pl.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/company_overview.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply Lead Gen Inbound/3PL funnel split to company_overview"
            git push
          fi
      - name: Cleanup probe files if present
        run: |
          set -euo pipefail
          rm -f api/_size_probe.txt
          if git status --porcelain | grep -q .; then
            git rm -f api/_size_probe.txt 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git diff --cached --quiet; then
              echo "no probe cleanup"
            else
              git commit -m "Remove MCP size probe file" || true
              git push || true
            fi
          fi
